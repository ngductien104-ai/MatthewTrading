# Sổ khuyến nghị — nguồn sự thật DUY NHẤT cho thẻ "Tín hiệu giao dịch".
#
# TRỐNG là trạng thái hợp lệ. Dashboard sẽ hiện "Chưa có tín hiệu nào" chứ
# không hỏng, và đó là câu trả lời đúng cho một ngày không có khuyến nghị.
#
# Cách thêm: nói với Claude trong phiên, hoặc tự thêm một mục theo mẫu dưới.
# Lịch nhắc 11h25 và 14h55 hằng ngày sẽ hỏi trước mỗi lần bản tin chạy.
#
# ⚠️ `price_quoted` là giá NIÊM YẾT lúc ra khuyến nghị (thô, chưa điều chỉnh).
# TUYỆT ĐỐI không lấy nó chia cho giá hôm nay để tính lãi lỗ.
# `signal_tracker.py` đo trên chuỗi giá ĐÃ ĐIỀU CHỈNH của DataPro ở cả hai đầu.
# Bằng chứng vì sao bắt buộc — PET, đo 09/09/2026:
#   giá niêm yết 18/06/2026 = 54,80 · close điều chỉnh = 37,80 · adj_rate 1,4496
#   so ngây thơ 37,95 / 54,80 → −30,7%   (SAI, đó là pha loãng thưởng cổ phiếu)
#   so đúng    37,95 / 37,80 → +0,4%    (ĐÚNG)
#
# Mẫu một mục — bốn trường bắt buộc là symbol, date, action, và một trong
# buy_zone / target / stop:
#
# - symbol: VCB
#   date: 2026-09-10          # ngày ra khuyến nghị
#   action: MUA               # MUA | BAN | NAM_GIU | TICH_LUY | CHO | TRUNG_LAP | SWITCH
#   price_quoted: 58.70       # giá niêm yết lúc khuyến nghị
#   buy_zone: [56.0, 58.0]    # hoặc [null, 58.0] nghĩa là "≤ 58,0"
#   target: 66.0              # chốt lời
#   stop: 54.0                # cắt lỗ
#   confidence: 0.6           # tuỳ chọn
#   status: open              # open | closed
#   source: _vcb_committee    # tuỳ chọn, thư mục hồ sơ
#   note: >-
#     Lý do vào lệnh, viết cho chính mình đọc lại sau ba tháng.

